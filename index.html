<!DOCTYPE html>
<html>
<head>
    <title>My Restaurant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            margin: 0;
        }

        header {
            background: #222;
            color: white;
            padding: 30px;
        }

        .menu {
            background: white;
            margin: 20px auto;
            padding: 20px;
            max-width: 500px;
            border-radius: 15px;
        }

        .item {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        .price {
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>🍔 My Restaurant</h1>
    <p>Welcome!</p>
</header>

<div class="menu">

    <div class="item">
        <h2>Classic Burger</h2>
        <p>Beef burger with cheese and lettuce</p>
        <p class="price">$8</p>
    </div>

    <div class="item">
        <h2>Chicken Burger</h2>
        <p>Crispy chicken with lettuce and sauce</p>
        <p class="price">$7</p>
    </div>

    <div class="item">
        <h2>French Fries</h2>
        <p>Crispy golden fries</p>
        <p class="price">$3</p>
    </div>

    <div class="item">
        <h2>Cola</h2>
        <p>Cold soft drink</p>
        <p class="price">$2</p>
    </div>

</div>

</body>
</html>
